name: Publish completed post-fix Qwen GPU SSD timing in PR description
on:
  push:
    branches: [feature/qwen35-hybrid-self-spec]
    paths: ['.github/workflows/qwen35-speed-pr-update.yml']
permissions:
  contents: read
  pull-requests: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const e = JSON.parse(fs.readFileSync('docs/validation/qwen35-ssd-postfix-speed-20261018.json', 'utf8'));
            if (e.execution_status !== 'passed' || e.planned_cases !== 58 || e.cases.length !== 58 ||
                e.measured_cases !== 50 || e.measured_speculative_cases !== 28 ||
                !e.performance_quality.storage_timeout_observed || e.status !== 'completed_with_storage_timeouts' ||
                !e.binaries_match_qualified_fix || e.cases.some(c => !c.valid || c.tokens.length !== 32 ||
                    c.timing.audit || c.timing.approximate_expert_reuse || !c.timing.ssd || !c.timing.direct_io) ||
                e.suites.some(s => s.status !== 'passed')) throw new Error('Incomplete benchmark evidence');
            const pr = (await github.rest.pulls.get({...context.repo, pull_number: 3})).data;
            if (pr.state !== 'open' || !pr.draft || pr.head.sha !== context.sha ||
                pr.head.ref !== 'feature/qwen35-hybrid-self-spec' || pr.base.ref !== 'orin') throw new Error('PR identity/head/state changed');
            const body = fs.readFileSync('.github/qwen35-speed-pr-description.md', 'utf8');
            await github.rest.pulls.update({...context.repo, pull_number: 3, body});
            await core.summary.addLink('Updated PR #3 with completed GPU/SSD speed matrix', pr.html_url).write();
