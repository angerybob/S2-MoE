name: Update Qwen3-Next Draft PR description
on:
  push:
    branches: [feature/qwen3next-self-spec]
    paths: ['.github/workflows/qwen3next-update-description.yml', '.github/qwen3next-pr-body.md']
permissions:
  contents: read
  pull-requests: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const crypto = require('node:crypto');
            const args = {...context.repo, pull_number: 2};
            const pr = (await github.rest.pulls.get(args)).data;
            if (pr.base.ref !== 'orin' || pr.head.ref !== 'feature/qwen3next-self-spec' || !pr.draft || pr.state !== 'open') {
              throw new Error('Unexpected PR branches or state');
            }
            const body = fs.readFileSync('.github/qwen3next-pr-body.md', 'utf8');
            const digest = crypto.createHash('sha256').update(pr.body).digest('hex');
            if (pr.body !== body && digest !== '853351e9fb605a0272630e76e8e3591f523a231d5e77908b3ca7339d89f92545') {
              throw new Error('PR description changed since preparation; refusing to overwrite concurrent edits');
            }
            const result = (await github.rest.pulls.update({...args, body})).data;
            if (result.body !== body || !result.draft || result.base.ref !== 'orin') {
              throw new Error('PR description readback mismatch');
            }
            core.notice('Updated original Draft PR description: ' + result.html_url);
            await core.summary.addLink('Updated PR description', result.html_url).write();
