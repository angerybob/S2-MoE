name: Update Qwen3.5 PR with measured Orin CPU performance
on:
  push:
    branches: [feature/qwen35-hybrid-self-spec]
    paths: ['.github/workflows/qwen35-update-pr.yml']
permissions:
  contents: read
  pull-requests: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const names = ['qwen35-orin-cpu-benchmark-20261018.json',
              'qwen35-orin-cpu-confirm-code-20261018.json', 'qwen35-orin-cpu-confirm-math-20261018.json'];
            for (const name of names) {
              const report = JSON.parse(fs.readFileSync('docs/validation/' + name, 'utf8'));
              if (report.status !== 'passed' || report.source_dirty ||
                  report.cases.some(c => !c.valid || c.timing.audit || !c.timing.quiet)) {
                throw new Error('Incomplete benchmark evidence: ' + name);
              }
            }
            const pr = (await github.rest.pulls.get({...context.repo, pull_number: 3})).data;
            if (pr.state !== 'open' || pr.base.ref !== 'orin' ||
                pr.head.ref !== 'feature/qwen35-hybrid-self-spec' || pr.head.sha !== context.sha) {
              throw new Error('PR identity or head changed; refusing to update');
            }
            const addition = fs.readFileSync('.github/qwen35-benchmark-update.md', 'utf8').trim();
            const previous = pr.body || '';
            const marker = /<!-- qwen35-orin-benchmark:start -->[\s\S]*?<!-- qwen35-orin-benchmark:end -->/;
            const body = marker.test(previous) ? previous.replace(marker, addition) : previous.trimEnd() + '\n\n' + addition;
            if (body !== previous) await github.rest.pulls.update({...context.repo, pull_number: 3, body});
            core.notice('Updated PR #3 performance evidence; review state unchanged.');
            await core.summary.addLink('Updated experimental Qwen3.5 PR', pr.html_url).write();
