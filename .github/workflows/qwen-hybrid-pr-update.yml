name: Synchronize Qwen hybrid S2-MoE PR description
on:
  push:
    branches: [feature/qwen35-hybrid-self-spec]
    paths: ['.github/workflows/qwen-hybrid-pr-update.yml']
permissions:
  contents: read
  pull-requests: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const evidence = JSON.parse(fs.readFileSync('docs/validation/qwen-hybrid-ssd-integration-20261018.json', 'utf8'));
            const timing = JSON.parse(fs.readFileSync('docs/validation/qwen-hybrid-ssd-main-qwen35-20261018.json', 'utf8'));
            if (evidence.status !== 'passed' || evidence.cuda_build_regression.passed !== 34 ||
                evidence.real_models.qwen35.status !== 'passed' || evidence.real_models.qwen3next.status !== 'passed' ||
                timing.coverage.main.status !== 'passed' || timing.coverage.main.cases !== 7 ||
                timing.status !== 'failed' || !evidence.known_limitations.some(s => s.includes('math'))) throw new Error('Evidence scope/limitation changed');
            const pr = (await github.rest.pulls.get({...context.repo, pull_number: 3})).data;
            if (pr.state !== 'open' || !pr.draft || pr.head.sha !== context.sha ||
                pr.head.ref !== 'feature/qwen35-hybrid-self-spec' || pr.base.ref !== 'orin') throw new Error('PR identity/head/state changed');
            const body = fs.readFileSync('.github/qwen-hybrid-pr-description.md', 'utf8');
            await github.rest.pulls.update({...context.repo, pull_number: 3, body,
              title: 'Integrate experimental Qwen3-Next and Qwen3.5-MoE with S2-MoE'});
            await core.summary.addLink('Updated experimental PR #3', pr.html_url).write();
