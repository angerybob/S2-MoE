name: Inspect hybrid integration CI failures
on:
  push:
    branches: [feature/qwen35-hybrid-self-spec]
    paths: ['.github/workflows/qwen-hybrid-ci-diagnostic.yml']
permissions:
  contents: read
  actions: read
  pull-requests: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read failed build logs with the repository token
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run view 39107459844 --repo angerybob/S2-MoE --log-failed > "$RUNNER_TEMP/hybrid-build.log"
          gh run view 39107459818 --repo angerybob/S2-MoE --log-failed > "$RUNNER_TEMP/hybrid-typecheck.log"
          gh run download 39107459818 --repo angerybob/S2-MoE --name next-typecheck-baseline-comparison --dir "$RUNNER_TEMP/hybrid-typecheck-artifact"
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            let lines = [];
            const comparison = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/hybrid-typecheck-artifact/comparison.json', 'utf8'));
            lines.push('Original added diagnostics:', JSON.stringify(comparison.added), 'Original removed diagnostics:', JSON.stringify(comparison.removed));
            for (const name of ['hybrid-build.log', 'hybrid-typecheck.log']) {
              const all = fs.readFileSync(process.env.RUNNER_TEMP + '/' + name, 'utf8').split('\n');
              const selected = new Set();
              for (let i = 0; i < all.length; i++) {
                if (/error:|undefined reference|fatal error|New diagnostics|new_diagnostics|added|diagnostics_identical|warningCount|errorCount/.test(all[i])) {
                  for (let j = Math.max(0, i - 2); j <= Math.min(all.length - 1, i + 4); j++) selected.add(j);
                }
              }
              lines.push(name, ...[...selected].sort((a,b)=>a-b).map(i => all[i]));
            }
            const diagnostic = lines.join('\n').replaceAll('`', "'").slice(0, 18000);
            const pr = (await github.rest.pulls.get({...context.repo, pull_number: 3})).data;
            if (pr.state !== 'open' || pr.head.sha !== context.sha || pr.head.ref !== 'feature/qwen35-hybrid-self-spec' || pr.base.ref !== 'orin') throw new Error('PR identity/head changed');
            const addition = '<!-- hybrid-ci-diagnostic:start -->\n<details><summary>Integration CI diagnostics (temporary)</summary>\n\n```text\n' + diagnostic + '\n```\n</details>\n<!-- hybrid-ci-diagnostic:end -->';
            const marker = /<!-- hybrid-ci-diagnostic:start -->[\s\S]*?<!-- hybrid-ci-diagnostic:end -->/;
            const body = marker.test(pr.body || '') ? pr.body.replace(marker, addition) : (pr.body || '') + '\n\n' + addition;
            await github.rest.pulls.update({...context.repo, pull_number: 3, body, title: 'Integrate experimental Qwen3-Next and Qwen3.5-MoE with S2-MoE'});
            await core.summary.addCodeBlock(diagnostic).write();
