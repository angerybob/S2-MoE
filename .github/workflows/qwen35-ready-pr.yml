name: Mark qualified experimental Qwen hybrid PR ready for review
on:
  push:
    branches: [feature/qwen35-hybrid-self-spec]
    paths: ['.github/workflows/qwen35-ready-pr.yml']
permissions:
  contents: read
  checks: read
  pull-requests: write
jobs:
  ready:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const qualified = '3dfd1db5e44cdcc5fc7519cf1afc580b107c9d1d';
            const commit = (await github.rest.repos.getCommit({...context.repo, ref: context.sha})).data;
            if (commit.parents.length !== 1 || commit.parents[0].sha !== qualified ||
                commit.files.length !== 1 || commit.files[0].filename !== '.github/workflows/qwen35-ready-pr.yml') {
              throw new Error('Changes beyond the reviewed readiness helper');
            }
            const checks = await github.paginate(github.rest.checks.listForRef, {...context.repo, ref: qualified, per_page: 100});
            for (const name of ['cpu-correctness', 'independent-ar', 'compare']) {
              if (!checks.some(c => c.name === name && c.conclusion === 'success')) throw new Error(`Missing successful ${name}`);
            }
            const e = JSON.parse(fs.readFileSync('docs/validation/qwen35-ssd-postfix-speed-20261018.json', 'utf8'));
            if (e.execution_status !== 'passed' || e.status !== 'completed_with_storage_timeouts' ||
                e.cases.length !== 58 || e.measured_speculative_cases !== 28 ||
                !e.binaries_match_qualified_fix || e.cases.some(c => !c.valid)) throw new Error('Incomplete qualified evidence');
            const pr = (await github.rest.pulls.get({...context.repo, pull_number: 3})).data;
            if (pr.state !== 'open' || !pr.draft || pr.head.sha !== context.sha ||
                pr.head.ref !== 'feature/qwen35-hybrid-self-spec' || pr.base.ref !== 'orin' ||
                !pr.body.includes('181') || !pr.body.includes('58/58') || !pr.body.toLowerCase().includes('experimental')) {
              throw new Error('PR identity, scope, or evidence changed');
            }
            const result = await github.graphql(`mutation($id: ID!) {
              markPullRequestReadyForReview(input: {pullRequestId: $id}) {
                pullRequest { url isDraft }
              }
            }`, {id: pr.node_id});
            if (result.markPullRequestReadyForReview.pullRequest.isDraft) throw new Error('PR is still draft');
            await core.summary.addHeading('Experimental PR ready for review')
              .addLink('PR #3', pr.html_url)
              .addRaw('\nFunctional qualification passed. Repository-wide checks are not all green. NVMe timeout-contaminated timings are not a stable speedup claim. No merge performed.\n').write();
