name: Inspect Qwen hybrid PR CI failures against orin
on:
  push:
    branches: [feature/qwen35-hybrid-self-spec]
    paths: ['.github/workflows/qwen35-ci-triage.yml']
permissions:
  contents: read
  actions: read
jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
      - uses: actions/checkout@v4
        with:
          ref: orin
          path: baseline
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compare repository lint under the same dependencies
        run: |
          python -m pip install flake8 flake8-no-print
          python - <<'PY'
          import collections, json, subprocess
          from pathlib import Path
          def lint(root):
              p = subprocess.run(['python', '-m', 'flake8', '--format=%(path)s|%(code)s|%(text)s'], cwd=root, text=True, capture_output=True)
              if p.returncode not in (0, 1):
                  raise RuntimeError(p.stderr)
              return collections.Counter(p.stdout.splitlines())
          b, c = lint('baseline'), lint('candidate')
          added = list((c-b).elements())
          result = {'baseline': sum(b.values()), 'candidate': sum(c.values()), 'added': added, 'removed': list((b-c).elements())}
          Path('lint-comparison.json').write_text(json.dumps(result, indent=2))
          print('::notice title=Lint baseline comparison::' + json.dumps(result).replace('%', '%25').replace('\n', '%0A').replace('\r', '%0D'))
          PY
      - name: Extract actual errors from failed jobs
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const ref = 'ce574138af8e47f9807475768ad4476b0c917c54';
            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {...context.repo, head_sha: ref, per_page: 100});
            const failures = new Map();
            for (const run of runs) {
              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {...context.repo, run_id: run.id, per_page: 100});
              for (const job of jobs) if (job.conclusion === 'failure') failures.set(job.name, job);
            }
            const out = [];
            for (const job of failures.values()) {
              try {
                const log = (await github.request('GET /repos/{owner}/{repo}/actions/jobs/{job_id}/logs', {...context.repo, job_id: job.id})).data;
                const lines = String(log).split('\n');
                const hits = lines.filter(l => /error:|fatal error|undefined reference|invalid path|CMake Error|FAILED:|No such file|not found|cannot find|Assertion.*failed|tests failed|Error [0-9]|ModuleNotFoundError|ImportError/i.test(l));
                const item = {name: job.name, id: job.id, url: job.html_url, errors: hits.slice(0, 10), tail: lines.slice(-12)};
                out.push(item);
                core.notice(JSON.stringify(item).slice(0, 5500), {title: job.name});
              } catch (e) { core.warning(`${job.name}: ${e.message}`); }
            }
            fs.writeFileSync('ci-failure-details.json', JSON.stringify(out, null, 2));
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qwen-hybrid-ci-triage
          path: |
            lint-comparison.json
            ci-failure-details.json
