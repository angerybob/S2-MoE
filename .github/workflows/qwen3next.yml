name: Experimental Qwen3-Next

on:
  pull_request:
    branches: [orin]
    paths: ['src/**', 'include/**', 'ggml/**', 'examples/speculative-next/**', 'examples/CMakeLists.txt', 'tests/**', '.github/workflows/qwen3next.yml']
  push:
    branches: [feature/qwen3next-self-spec]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-correctness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy
      - name: Configure and build the experimental entry point and tests
        run: |
          cmake -S . -B build-next -DGGML_CUDA=OFF -DLLAMA_BUILD_TESTS=ON \
            -DLLAMA_BUILD_SERVER=OFF -DLLAMA_CURL=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build build-next --target llama-speculative-next test-qwen3next-state test-hybrid-placement -j2
      - name: Compare verification-prefix states and greedy output against AR
        run: ctest --test-dir build-next -R qwen3next --output-on-failure
