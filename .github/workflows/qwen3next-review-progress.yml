name: Inspect Next premerge CI evidence
on:
  push:
    branches: [feature/qwen3next-self-spec]
    paths: ['.github/workflows/qwen3next-review-progress.yml']
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 39042007097
          name: next-premerge-ci-evidence
          path: evidence
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const read = p => fs.readFileSync('evidence/'+p,'utf8');
            const lines = p => read(p).trim().split('\n').filter(Boolean);
            const before = new Set(lines('baseline-lint.txt'));
            const after = new Set(lines('candidate-lint.txt'));
            const added = [...after].filter(x => !before.has(x));
            const removed = [...before].filter(x => !after.has(x));
            core.notice(JSON.stringify({baseline:before.size,candidate:after.size,added,removed}));
            for (const name of ['lint','asan']) {
              const p = fs.existsSync('evidence/'+name+'.log') ? name+'.log' : name+'-error.txt';
              const all = lines(p);
              const errors = new Set();
              for (let i=0;i<all.length;i++) {
                if (/error:|fatal error|Error |FAILED|ERROR|undefined reference|No rule to make|Error at|not found|E[0-9]{3}|F[0-9]{3}|T[0-9]{3}/i.test(all[i])) {
                  for (let k=Math.max(0,i-1);k<=Math.min(all.length-1,i+1);k++) errors.add(all[k]);
                }
              }
              core.notice(name + ': ' + ([...errors].join('\n') || all.join('\n')).slice(-18000));
            }
