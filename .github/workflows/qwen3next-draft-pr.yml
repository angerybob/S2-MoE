name: Open experimental Qwen3-Next Draft PR

on:
  push:
    branches: [feature/qwen3next-self-spec]
    paths: ['.github/workflows/qwen3next-draft-pr.yml', '.github/qwen3next-draft-pr.md']
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  open-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Reuse an existing PR or create the authorized Draft PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const repo = context.repo;
            const head = 'feature/qwen3next-self-spec';
            const base = 'orin';
            let result;
            try {
              const existing = await github.rest.pulls.list({
                ...repo, head: `${repo.owner}:${head}`, base, state: 'open'
              });
              if (existing.data.length) {
                const pr = existing.data[0];
                result = {url: pr.html_url, number: pr.number, draft: pr.draft, reused: true};
              } else {
                const response = await github.rest.pulls.create({
                  ...repo, base, head, draft: true,
                  title: 'Add experimental Qwen3-Next expert-only self-speculation',
                  body: fs.readFileSync('.github/qwen3next-draft-pr.md', 'utf8')
                });
                const pr = response.data;
                result = {url: pr.html_url, number: pr.number, draft: pr.draft, reused: false};
              }
              core.notice(`Qwen3-Next PR: ${result.url}; draft=${result.draft}`);
              await core.summary.addHeading('Qwen3-Next review entry point')
                .addLink(result.url, result.url).addRaw(`\nDraft: ${result.draft}\n`).write();
            } catch (error) {
              result = {status: error.status, error: error.message};
              core.setFailed(`Draft PR creation was not permitted or failed: ${error.message}`);
            }
            fs.writeFileSync('qwen3next-draft-pr-result.json', JSON.stringify(result, null, 2));
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qwen3next-draft-pr-result
          path: qwen3next-draft-pr-result.json
